name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: check PERMISSIONS.md is up to date
        run: |
          java src/main/java/com/roorogeo/essentials/perm/PermissionNodes.java /tmp/PERMISSIONS.md
          diff -u PERMISSIONS.md /tmp/PERMISSIONS.md
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: essentials
          path: build/libs/
